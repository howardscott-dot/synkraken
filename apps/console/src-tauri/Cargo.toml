[package]
name = "synkraken-console"
version = "0.1.0"
description = "SynKraken Console"
authors = ["SynKraken contributors"]
edition = "2021"

[lib]
name = "synkraken_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
