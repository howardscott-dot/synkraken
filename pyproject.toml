[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synkraken"
version = "0.1.0"
description = "Open-source AI Workforce Operating System"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SynKraken Contributors"}
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "sse-starlette>=1.8.0",
    "uvicorn>=0.24.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
synkraken = "synkraken.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synkraken*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"