[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synkraken"
version = "0.1.0"
description = "Open-source AI Workforce Operating System"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SynKraken Contributors"}
]
requires-python = ">=3.11"
dependencies = ["cryptography>=46,<52", "keyring>=25,<27"]
keywords = ["ai", "agents", "workforce", "orchestration", "cli", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/howardscott-dot/synkraken"
Documentation = "https://github.com/howardscott-dot/synkraken/tree/main/docs"
Source = "https://github.com/howardscott-dot/synkraken"

[project.optional-dependencies]
browser = ["playwright>=1.56,<2"]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
synkraken = "synkraken.cli_main:main"
synkraken-daemon = "synkraken.__main__:main"
synkraken-send = "synkraken.cli_send:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synkraken*"]

[tool.setuptools.package-data]
synkraken = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
